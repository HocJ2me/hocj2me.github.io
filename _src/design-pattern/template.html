<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách khóa học Thầy Lê Chí Tuyền — Design Pattern với C++, Python &amp; Java</title>
<!-- File này được SINH TỰ ĐỘNG bởi design-pattern-src/build.py — sửa nội dung ở đó rồi build lại. -->
<style>
  :root{
    --blue:#0e7490; --blue-dark:#155e75; --accent:#2563eb; --bg:#f4f7fb; --card:#fff; --ink:#1e293b; --sub:#64748b;
    --line:#e2e8f0; --soft:#f1f5f9;
    --cre:#0891b2; --cre-bg:#ecfeff; --str:#d97706; --str-bg:#fffbeb; --beh:#7c3aed; --beh-bg:#f5f3ff;
    --ok:#16a34a; --bad:#dc2626;
    --code-bg:#0f172a; --code-ink:#e2e8f0;
    --mono:Consolas,"SFMono-Regular","Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.62;}
  a{color:var(--accent);}
  code{font-family:var(--mono);font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:5px;}
  header{
    background:linear-gradient(135deg,#0e7490,#2563eb 55%,#7c3aed);
    color:#fff;padding:10px 20px 12px;position:sticky;top:0;z-index:60;box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .htop{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .htop a{color:#fff;font-size:.78rem;opacity:.9;text-decoration:none;font-weight:700;}
  .whoami{font-size:.78rem;opacity:.85;margin-right:10px;}
  .logout-btn{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.5);padding:4px 11px;border-radius:20px;font-size:.74rem;font-weight:700;cursor:pointer;}
  header h1{font-size:1.08rem;margin:4px 0 0;}
  header .sub{font-size:.78rem;opacity:.92;}
  .menubtn{display:none;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:16px;padding:4px 12px;font-weight:700;font-size:.78rem;cursor:pointer;margin-top:6px;}
  .layout{display:grid;grid-template-columns:270px 1fr;max-width:1320px;margin:0 auto;gap:0;}
  aside{position:sticky;top:86px;align-self:start;height:calc(100vh - 86px);overflow:auto;padding:16px 10px 30px 16px;border-right:1px solid var(--line);}
  .prog{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:12px;font-size:.8rem;}
  .prog .bar{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px;}
  .prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0e7490,#7c3aed);transition:width .3s;}
  .sgroup{margin:16px 6px 6px;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
  .sgroup small{display:block;text-transform:none;letter-spacing:0;font-weight:500;color:var(--sub);}
  .sgroup.g-cre{color:var(--cre);} .sgroup.g-str{color:var(--str);} .sgroup.g-beh{color:var(--beh);}
  .sitem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.86rem;}
  .sitem:hover{background:#e8eef6;}
  .sitem.active{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);font-weight:700;color:var(--blue-dark);}
  .sn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--sub);}
  .sitem.done .sn{background:var(--ok);color:#fff;}
  .tick{margin-left:auto;color:var(--ok);font-weight:800;display:none;}
  .sitem.done .tick{display:inline;}
  main{padding:20px 28px 70px;min-width:0;}
  .lesson{max-width:960px;margin:0 auto;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .hero{border-radius:18px;padding:22px 24px;color:#fff;margin-bottom:16px;}
  .hero-cre{background:linear-gradient(135deg,#0e7490,#0891b2);} .hero-str{background:linear-gradient(135deg,#b45309,#d97706);}
  .hero-beh{background:linear-gradient(135deg,#6d28d9,#7c3aed);} .hero-ov{background:linear-gradient(135deg,#0e7490,#2563eb 60%,#7c3aed);}
  .hero h2{margin:8px 0 6px;font-size:1.65rem;line-height:1.25;}
  .hero h2 small{font-weight:500;opacity:.9;font-size:.62em;}
  .hero .intent{margin:0;background:rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;font-size:.97rem;}
  .crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;}
  .hero .gchip{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.5);}
  .gchip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:12px;border:1px solid transparent;}
  .gchip.g-cre{background:var(--cre-bg);color:var(--cre);border-color:#a5f3fc;}
  .gchip.g-str{background:var(--str-bg);color:#b45309;border-color:#fde68a;}
  .gchip.g-beh{background:var(--beh-bg);color:var(--beh);border-color:#ddd6fe;}
  .stars{color:#fbbf24;letter-spacing:1px;} .stars .off{opacity:.3;}
  .tbl .stars{color:#f59e0b;}
  .ovstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
  .ovstats div{background:rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;}
  .ovstats b{display:block;font-size:1.5rem;} .ovstats span{font-size:.78rem;opacity:.9;}
  .startbtn{display:inline-block;background:#fff;color:var(--blue-dark);font-weight:800;text-decoration:none;padding:9px 18px;border-radius:22px;}
  .analogy{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid #f59e0b;border-radius:12px;padding:14px 16px;margin-bottom:6px;}
  .aemoji{font-size:2rem;line-height:1;}
  h3{display:flex;align-items:center;gap:10px;font-size:1.18rem;color:var(--blue-dark);margin:30px 0 10px;scroll-margin-top:100px;}
  h3 .n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--blue-dark);color:#fff;display:grid;place-items:center;font-size:.85rem;}
  h4.sub{margin:16px 0 6px;font-size:.98rem;}
  h5{margin:0 0 6px;font-size:.92rem;}
  .prose p{margin:8px 0;} .prose ul,.prose ol{margin:6px 0;padding-left:22px;} .prose li{margin:4px 0;}
  .callout{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.94rem;}
  .callout.warn{background:#fff7ed;border-color:#fed7aa;}
  .tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:.9rem;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
  .tbl th{background:var(--soft);font-size:.82rem;}
  .tbl.list a{text-decoration:none;font-weight:600;}
  .fig{margin:10px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto;}
  .fig svg{display:block;width:100%;height:auto;margin:0 auto;}
  .fig figcaption{font-size:.8rem;color:var(--sub);margin-top:8px;text-align:center;}
  /* UML */
  .uml .u-box rect{fill:#fff;stroke:#334155;stroke-width:1.3;}
  .uml .u-box .u-head{stroke:none;fill:#f1f5f9;}
  .uml .u-int .u-head{fill:#e0f2fe;} .uml .u-abs .u-head{fill:#ede9fe;} .uml .u-cli .u-head{fill:#fef3c7;}
  .uml .u-box > rect:first-child{fill:#fff;}
  .uml .u-box{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.12));}
  .uml text{font-family:var(--mono);fill:#0f172a;}
  .uml .u-name{font-size:13px;font-weight:700;} .uml .u-st{font-size:10.5px;fill:#475569;}
  .uml .u-mem{font-size:11.5px;} .uml .u-it{font-style:italic;} .uml .u-ul{text-decoration:underline;}
  .uml .u-sep{stroke:#94a3b8;stroke-width:1;}
  .uml .u-edge{fill:none;stroke:#475569;stroke-width:1.4;} .uml .u-dash{stroke-dasharray:6 4;}
  .uml .u-tri{fill:#fff;stroke:#475569;stroke-width:1.4;} .uml .u-open{fill:none;stroke:#475569;stroke-width:1.4;}
  .uml .u-dia{fill:#fff;stroke:#475569;stroke-width:1.3;} .uml .u-dia-fill{fill:#475569;stroke:#475569;}
  .uml .u-lbl rect{fill:#f8fafc;stroke:#e2e8f0;} .uml .u-lbl text{font-size:10.5px;fill:#334155;}
  .uml .u-note polygon{fill:#fefce8;stroke:#ca8a04;stroke-width:1.1;} .uml .u-note .u-fold{fill:none;stroke:#ca8a04;}
  .uml .u-note text{font-size:11px;fill:#713f12;}
  .uml .u-grp rect{fill:#f8fafc;stroke:#94a3b8;stroke-dasharray:5 4;} .uml .u-grp text{font-size:11px;fill:#64748b;font-family:'Segoe UI',Arial,sans-serif;}
  .uml .u-zone{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;font-weight:700;fill:#64748b;letter-spacing:.06em;}
  /* minh hoạ */
  .illus text{font-family:'Segoe UI',Arial,sans-serif;fill:#0f172a;}
  .illus .il-t{font-size:14px;font-weight:700;} .illus .il-s{font-size:12.5px;} .illus .il-mute{fill:#64748b;}
  .illus .il-mono{font-family:var(--mono);font-size:12.5px;}
  .illus .il-line{stroke:#475569;stroke-width:1.6;fill:none;} .illus .il-thin{stroke-width:1;opacity:.7;}
  .illus .il-arrowhead{fill:#475569;}
  .illus .il-tri{fill:#fff;stroke:#475569;stroke-width:1.4;} .illus .il-open{fill:none;stroke:#475569;stroke-width:1.5;}
  .illus .il-dia{fill:#fff;stroke:#475569;stroke-width:1.3;} .illus .il-diaf{fill:#475569;}
  .illus .il-mini{fill:#f1f5f9;stroke:#334155;}
  .illus .il-node-c{fill:#e0f2fe;stroke:#0369a1;stroke-width:1.4;} .illus .il-node-l{fill:#fff;stroke:#64748b;stroke-width:1.3;}
  .illus .il-dot{fill:#0f172a;}
  .illus .il-ring1{fill:#fef3c7;stroke:#d97706;} .illus .il-ring2{fill:#fde68a;stroke:#d97706;opacity:.85;} .illus .il-ring3{fill:#fcd34d;stroke:#b45309;opacity:.55;}
  .illus .il-g{stroke-width:1.5;} .illus .il-cre{fill:var(--cre-bg);stroke:var(--cre);} .illus .il-str{fill:var(--str-bg);stroke:var(--str);} .illus .il-beh{fill:var(--beh-bg);stroke:var(--beh);}
  .illus .il-gt{font-size:16px;font-weight:800;}
  .illus .il-chip{fill:#fff;stroke:#cbd5e1;} .illus a:hover .il-chip{fill:#e0f2fe;stroke:#0369a1;}
  /* code */
  .hint{font-size:.86rem;color:var(--sub);margin:4px 0 8px;}
  .ltabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:-1px;position:relative;z-index:2;}
  .ltab{border:1px solid var(--line);border-bottom:none;background:#e9eef5;padding:7px 16px;border-radius:10px 10px 0 0;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--sub);}
  .ltab.active{background:var(--code-bg);color:#fff;border-color:var(--code-bg);}
  .lpane{display:none;} .lpane.active{display:block;}
  .codebox{background:var(--code-bg);border-radius:0 12px 12px 12px;overflow:hidden;}
  .codebar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#1e293b;color:#cbd5e1;font-size:.78rem;}
  .codebar .fname{font-family:var(--mono);color:#fff;} .codebar .lines{margin-right:auto;opacity:.7;}
  .cbtn{background:#334155;color:#e2e8f0;border:none;border-radius:6px;padding:4px 10px;font-size:.74rem;cursor:pointer;}
  .cbtn:hover{background:#475569;}
  pre.code{margin:0;padding:14px 16px;overflow:auto;max-height:620px;color:var(--code-ink);font-family:var(--mono);font-size:.84rem;line-height:1.55;tab-size:4;}
  pre.code code{background:none;padding:0;font-size:inherit;}
  .t-kw{color:#c084fc;} .t-ty{color:#67e8f9;} .t-fn{color:#fde68a;} .t-str{color:#86efac;} .t-num{color:#fdba74;}
  .t-com{color:#7c8ba1;font-style:italic;} .t-pre{color:#f9a8d4;} .t-ann{color:#f9a8d4;}
  .runcmd{font-size:.82rem;margin:8px 0;color:var(--sub);} .runcmd code{background:#e2e8f0;}
  .outbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
  .outbar{background:#ecfdf5;color:#166534;font-size:.78rem;font-weight:700;padding:6px 12px;border-bottom:1px solid #bbf7d0;}
  pre.out{margin:0;padding:12px 14px;font-family:var(--mono);font-size:.82rem;line-height:1.5;overflow:auto;max-height:420px;white-space:pre;}
  ul.notes li{margin:5px 0;}
  .emb{display:flex;gap:12px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:12px 16px;}
  .emb ul{margin:0;padding-left:20px;} .emb li{margin:5px 0;} .embicon{font-size:1.6rem;}
  .pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pc > div,.pc3 > div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .pc ul{margin:0;padding-left:20px;} .pros{border-top:4px solid var(--ok)!important;} .cons{border-top:4px solid var(--bad)!important;}
  .pros h5{color:var(--ok);} .cons h5{color:var(--bad);}
  .pc3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px;} .pc3 p{margin:0;font-size:.9rem;color:var(--sub);}
  .real{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .real > div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.88rem;}
  .real ul{margin:0;padding-left:18px;}
  ul.when li{margin:4px 0;}
  ol.ex{padding-left:22px;} ol.ex li{margin:7px 0;} ol.ex label{cursor:pointer;} ol.ex input:checked + span{color:var(--sub);text-decoration:line-through;}
  .refs{margin-top:18px;font-size:.86rem;background:#fff;border:1px dashed #cbd5e1;border-radius:10px;padding:10px 14px;}
  .donebar{margin-top:18px;text-align:center;}
  .donebtn{background:#fff;border:2px solid var(--ok);color:var(--ok);font-weight:800;padding:9px 18px;border-radius:22px;cursor:pointer;font-size:.9rem;}
  .donebtn.on{background:var(--ok);color:#fff;}
  .pnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}
  .pn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-decoration:none;font-weight:700;color:var(--blue-dark);}
  .pn:hover{border-color:var(--blue);}
  .roadmap{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .road{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem;align-items:flex-start;}
  .road a{text-decoration:none;font-weight:600;} .road small{color:var(--sub);}
  .rb{flex:none;background:var(--blue-dark);color:#fff;font-weight:700;font-size:.74rem;border-radius:8px;padding:3px 8px;}
  footer{text-align:center;color:var(--sub);font-size:.78rem;padding:20px;}
  .lesson,.lesson li,.lesson td,.lesson p{overflow-wrap:anywhere;}
  .pc > div,.pc3 > div,.real > div,.road{min-width:0;}
  @media(max-width:900px){
    .layout{grid-template-columns:minmax(0,1fr);}
    .tbl{display:block;overflow-x:auto;}
    header h1{font-size:.95rem;} header .sub{font-size:.72rem;}
    aside{display:none;position:fixed;top:0;left:0;bottom:0;height:auto;width:280px;background:var(--bg);z-index:80;box-shadow:4px 0 20px rgba(0,0,0,.2);padding-top:20px;}
    aside.open{display:block;}
    .menubtn{display:inline-block;}
    main{padding:16px 16px 60px;}
    .pc,.pc3,.real,.roadmap{grid-template-columns:1fr;}
    .ovstats{grid-template-columns:repeat(2,1fr);}
    .hero h2{font-size:1.35rem;}
  }
  .scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:70;} .scrim.on{display:block;}
</style>
<script src="auth.js"></script>
<script>requireAuth();</script>

<body>
<header>
  <div class="htop">
    <a href="courses.html">← Danh sách khóa học</a>
    <div><span class="whoami" id="whoamiLabel"></span><button class="logout-btn" onclick="logout()">Đăng xuất</button></div>
  </div>
  <h1>🎓 Danh sách khóa học Thầy Lê Chí Tuyền</h1>
  <div class="sub">Khóa học: 🧩 Design Pattern với C++ (hướng nhúng), Python &amp; Java · 24 mẫu · 12 buổi × 2 giờ · Phím ← → để chuyển bài</div>
  <button class="menubtn" id="menuBtn">☰ Danh sách bài</button>
</header>

<div class="layout">
  <aside id="side">
    <div class="prog"><b>Tiến độ:</b> <span id="progTxt">0/{{TOTAL}}</span> bài<div class="bar"><i id="progBar"></i></div></div>
    {{SIDEBAR}}
  </aside>
  <main id="main">
    {{LESSONS}}
  </main>
</div>
<div class="scrim" id="scrim"></div>
<footer>© Danh sách khóa học Thầy Lê Chí Tuyền · Design Pattern</footer>

<script>
(function(){
  var ORDER = {{ORDER}};
  var TOTAL = {{TOTAL}};
  function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  var u = null; try{ u = sessionStorage.getItem('mb_auth_user'); }catch(e){}
  document.getElementById('whoamiLabel').textContent = u ? ('👤 ' + u) : '';

  // ----- điều hướng theo #hash
  function show(id){
    if(ORDER.indexOf(id) < 0) id = 'overview';
    document.querySelectorAll('.lesson').forEach(function(s){ s.hidden = (s.id !== id); });
    document.querySelectorAll('.sitem').forEach(function(a){ a.classList.toggle('active', a.dataset.id === id); });
    var sec = document.getElementById(id);
    document.title = sec.dataset.title + ' — Design Pattern | Khóa học Thầy Lê Chí Tuyền';
    closeMenu();
  }
  function route(){
    var h = decodeURIComponent(location.hash.slice(1));
    var target = null;
    if(h && ORDER.indexOf(h) < 0){ target = document.getElementById(h); }
    if(target){
      var les = target.closest('.lesson');
      show(les ? les.id : 'overview');
      setTimeout(function(){ target.scrollIntoView(); }, 0);
    } else {
      show(h || 'overview');
      window.scrollTo(0, 0);
      setTimeout(function(){ window.scrollTo(0, 0); }, 0);   // chặn trình duyệt tự cuộn tới #id
    }
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('click', function(e){
    var g = e.target.closest('[data-goto]');
    if(g){ e.preventDefault(); location.hash = g.dataset.goto; }
  });
  document.addEventListener('keydown', function(e){
    if(e.target.matches('input,textarea')) return;
    var cur = ORDER.indexOf(document.querySelector('.lesson:not([hidden])').id);
    if(e.key === 'ArrowRight' && cur < ORDER.length - 1) location.hash = ORDER[cur + 1];
    if(e.key === 'ArrowLeft' && cur > 0) location.hash = ORDER[cur - 1];
  });

  // ----- menu trên điện thoại
  var side = document.getElementById('side'), scrim = document.getElementById('scrim');
  function closeMenu(){ side.classList.remove('open'); scrim.classList.remove('on'); }
  document.getElementById('menuBtn').onclick = function(){ side.classList.add('open'); scrim.classList.add('on'); };
  scrim.onclick = closeMenu;

  // ----- tab ngôn ngữ (đồng bộ mọi bài, nhớ lựa chọn)
  function setLang(lang){
    document.querySelectorAll('.ltab').forEach(function(t){ t.classList.toggle('active', t.dataset.lang === lang); });
    document.querySelectorAll('.lpane').forEach(function(p){ p.classList.toggle('active', p.dataset.lang === lang); });
    save('dp_lang', lang);
  }
  document.querySelectorAll('.ltab').forEach(function(t){ t.onclick = function(){ setLang(t.dataset.lang); }; });
  setLang(load('dp_lang', 'cpp'));

  // ----- sao chép / tải code
  document.addEventListener('click', function(e){
    var b = e.target.closest('.cbtn'); if(!b) return;
    var code = b.closest('.codebox').querySelector('pre.code').textContent;
    if(b.dataset.act === 'copy'){
      var done = function(){ b.textContent = 'Đã chép ✓'; setTimeout(function(){ b.textContent = 'Sao chép'; }, 1500); };
      if(navigator.clipboard) navigator.clipboard.writeText(code).then(done, function(){});
    } else {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([code], {type:'text/plain;charset=utf-8'}));
      a.download = b.dataset.name; document.body.appendChild(a); a.click(); a.remove();
    }
  });

  // ----- tiến độ học & bài tập
  var done = load('dp_done', {});
  function paint(){
    var n = 0;
    document.querySelectorAll('.sitem').forEach(function(a){
      var on = !!done[a.dataset.id]; a.classList.toggle('done', on); if(on) n++;
    });
    document.querySelectorAll('.donebtn').forEach(function(b){
      var on = !!done[b.dataset.done];
      b.classList.toggle('on', on);
      b.textContent = on ? '✓ Đã học xong — bấm để bỏ đánh dấu' : '☐ Đánh dấu đã học xong bài này';
    });
    document.getElementById('progTxt').textContent = n + '/' + TOTAL;
    document.getElementById('progBar').style.width = (100 * n / TOTAL) + '%';
    var ov = document.getElementById('ovDone'); if(ov) ov.textContent = n;
  }
  document.querySelectorAll('.donebtn').forEach(function(b){
    b.onclick = function(){ var k = b.dataset.done; if(done[k]) delete done[k]; else done[k] = 1; save('dp_done', done); paint(); };
  });
  var ex = load('dp_ex', {});
  document.querySelectorAll('[data-ex]').forEach(function(c){
    c.checked = !!ex[c.dataset.ex];
    c.onchange = function(){ if(c.checked) ex[c.dataset.ex] = 1; else delete ex[c.dataset.ex]; save('dp_ex', ex); };
  });
  paint();
  route();
})();
</script>
</body>
</html>
